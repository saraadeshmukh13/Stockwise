# Dedicated local demo database. Do not change this URL to stockwise_db.
spring.datasource.url=jdbc:mysql://localhost:3306/stockwise_demo
# Supply both STOCKWISE_DEMO_DB_* variables before launch. Empty fallbacks prevent an unresolved
# ${...} token from ever being sent as a MySQL username; missing credentials still fail connection.
spring.datasource.username=${STOCKWISE_DEMO_DB_USERNAME:}
spring.datasource.password=${STOCKWISE_DEMO_DB_PASSWORD:}

# Demo account credentials are read directly from STOCKWISE_DEMO_ADMIN_USERNAME
# and STOCKWISE_DEMO_ADMIN_PASSWORD by AdminUserBootstrap. This intentionally
# avoids legacy STOCKWISE_ADMIN_* environment variables overriding the demo account.

# Schema generation is confined to stockwise_demo when this profile is active.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
